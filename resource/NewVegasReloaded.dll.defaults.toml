[_Shaders.PBR.Main]
LightingScale = 0.725              # Sun and point light strength.
AmbientScale = 1.0                 # Weather ambient light strength.
SkylightingScale = 0.5             # Sky-colour ambient light. 0 disables it.
LinearLighting = true                # Light in linear space (correct falloff and light sums) instead of the game's gamma space, as Community Shaders' linear lighting. Objects and terrain.
MergeLightPasses = true              # With LinearLighting: lamps and highlights the game would add in extra passes are lit in the mesh's first pass instead, so they sum in linear space like the rest. Removes the brightness seams between meshes lit in one pass and meshes lit in several. Objects, hair, parallax, skin and first person (not tree branches).
LightingModel = 1                   # [0-1] How materials with an _rmaos map are lit. 1: as S.T.A.L.K.E.R. Anomaly does it (its GGX with Anomaly's sharper highlights, its diffuse falloff, its ambient and reflections), the maps still read from _rmaos. 0: OpenPBR, as before.
PBRLinearLighting = 1.0              # [0.0-1.0] How linearly materials with an _rmaos map are lit, on their own: 1 fully linear (as LinearLighting), 0 the game's gamma space (as LinearLighting off), in between a blend. Every other material follows LinearLighting.
VanillaEnvMapOnPBR = true           # Materials with an _rmaos map keep the game's own cubemap (environment map) reflection, drawn last, on top of the PBR result. Off, only NVR's PBR reflection (the dynamic cubemap or the sky) is drawn, as before.
KeepOffscreenLights = true          # Lamps stay on the meshes they light while their light sphere is off screen, instead of being dropped as the camera turns. The game draws a mesh differently by how many lamps it has (one pass, one combined pass, or several), so dropping a lamp switched nearby meshes between those and lights and highlights jumped as the view turned, mostly indoors. Lamps still fade out by distance as usual. Costs a little where several lamps are close together.
RouteLighting30 = true               # Draw the meshes the game gives its single-pass Lighting30 shader with the shaders NVR replaces instead, so they get NVR lighting, PBR and _rmaos maps: parallax occlusion meshes (as parallax), blood and bullet-hole decals with a normal map, and meshes saved with a Lighting30 or NoFader shader block. Applies to meshes as they load: restart the game after changing it.
DebugView = 0                        # Material debug: 0 off, 1 roughness (authored maps; vanilla materials show their glossiness), 2 metalness, 3 flags (R the game's specular flag, G an authored _rmaos map, B specular distance fade), 4 ambient normal (white faces the sky), 5 the dynamic environment cube along the normal (authored materials; black when DynamicCubemaps is off).

