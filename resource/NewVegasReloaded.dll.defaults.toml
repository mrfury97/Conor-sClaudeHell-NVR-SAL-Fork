[_Shaders.Underwater.Status]
Enabled = true                      # Post Process underwater fog/godrays/caustics effect.

# Works on either shadow atlas format. At Shaders.ShadowsExteriors.ShadowMaps.Format = 0 (16-bit)
# GetEVSMExponents clamps the EVSM positive exponent from 40 to 5.54, which loosens the Chebyshev
# bound and biases occluded points toward lit; the shader compensates by strengthening its light
# bleed reduction on that format (see BleedReduction in VolumetricLight.fx.hlsl). Format = 1 gives
# a tighter bound and slightly cleaner shadow edges, at double the atlas bandwidth, but is not
# required. An earlier note here claimed it was; that was written while a camera-space bug was
# suppressing the shadow lookup entirely, and the format was never the cause.
[_Shaders.VolumetricLight.Main]
Strength = 55.0                     # Overall intensity multiplier for the light shaft. Responds on a 2.1 power curve, not linearly: the composite raises the shaft to that power, so doubling this gives 2^2.1 = 4.3x, and the slider has a soft bottom end that ramps hard. That curve is the point rather than a side effect -- it crushes dim scattering harder than bright, which pulls the general haze down relative to the bright shaft cores. It also saturates the shaft per-channel, so the ScatterR/G/B tint spreads and warm tints get warmer; retune the tint if that goes too far, not this. The usable range sits around 55 rather than around 1 because accumLightStrength in the shader is left at 0.04 -- see the comment there; the two can only move together, and rescaling them silently makes every saved config 55x too bright. Values well above this are safe: in-scattered light is additive over the scene and the whole chain runs in FP16 before tonemapping, so a bright shaft is an HDR highlight for the tonemapper to roll off, not a washed-out frame.
Anisotropy = 0.452                  # [0.0-0.9] Forward scattering bias (Henyey-Greenstein g). Controls how sharply light gathers toward the sun, and nothing else -- the phase function is normalised to peak at 1.0, so this sets the SHAPE of the lobe while Strength sets how much there is. Raw HG ties the two together (its peak climbs 7.4x from g=0.1 to g=0.6), which is why changing this used to change overall brightness. Shafts come from shadow occlusion, not from a tight lobe: too high and the effect collapses to a small bright patch around the sun, too low and it reads as flat haze across the whole frame.
AccumDistance = 6000.0              # How far the ray march looks, in world units, and nothing else. It used to also be the reference path the coefficients were normalised against, which made one setting do two unrelated jobs -- see ScatterReference below for why that faded the shafts out near the camera whenever this was raised. Now it only sets reach: raising it lets rays find occluders further out and costs near-field rays nothing. Steps grow geometrically (1.05 per step over 64 steps, summing to exactly one ray length), so raising this spends resolution in the far field rather than the near, and the near-field sampling of a ray that stops at a wall is unchanged whatever this is set to.
ScatterReference = 6000.0           # The path length the scattering and extinction coefficients are expressed against: a ray this long through undiminished medium accumulates unit scattering, and Extinction of 1.0 attenuates the scene behind it to 1/e over this distance. In effect it sets how dense the air is, and it is the knob to move if the shafts are too weak or too strong overall -- LOWER is denser, since the coefficients are divided by it. It was split off from AccumDistance because sharing one value made them fight: shaft brightness goes as rayLength/reference, and rayLength is pinned by the depth buffer for any ray that hits something, so raising the march range used to divide the brightness of every near-field ray while sky rays -- whose rayLength IS the range -- kept theirs. Raising the range from 6000 to 12000 halved a ray that stopped at a wall 800 units away. Keep this equal to AccumDistance for the pre-split behaviour; that is why both default to 6000.
NightDistance = 1500.0              # How far the ray march looks at night, in place of AccumDistance, fading in through dusk. After dark the light is the moon, and a full-length march through open moonlit air makes the distance glow in the moon's direction. Night shafts come from occluders near the camera, so a shorter reach removes that glow and keeps them. The glow scales with this: at 1500 against an AccumDistance of 6000, about a quarter of it remains. Raise it if night shafts from farther occluders go missing; set it equal to AccumDistance to turn it off.
FogInfluence = 0.236                # [0.0-1.0] How much VolumetricFog's density drives the scattering medium's density. Scattered light is proportional to how much medium a ray crosses, so at 0 the shafts are identical in clear desert air and in thick fog -- too strong where there is nothing to scatter off, too weak where the air is full of it. At 1 they track the fog the player can see: the same density VolumetricFog paints with (BaseDensity, WeatherImpact, MorningFogDip, SunriseSunsetBoost, Night DensityScale, and the noise's average), read from the VolumetricFog settings even when that effect is off. Low by default so clear weather keeps most of its shafts while fog still strengthens them.
Extinction = 1.0                    # [0.0-3.0] How much the medium attenuates the scene behind it, as optical depth over one AccumDistance of full-density medium: 1.0 dims a full-length path to 1/e. Tracked separately from how bright the shaft is, which is the point -- tying the two together is what made the old composite veil the scene in proportion to shaft brightness. A high value here is what gives the dense, hazy, light-filled air that reads as atmosphere rather than as decals of light laid over the frame; it does overlap what VolumetricFog does, and that overlap turns out to be worth having. Lower it toward 0 for shafts that add light without touching what is behind them.
HeightFalloff = 600.0               # World units over which the medium thins by 1/e going up, measured from the camera. A uniform medium glows as brightly 300 feet up as at ground level, which reads as an even wash; real haze is dense low and thin above, and that gradient is what makes a shaft read as a beam punching through a layer. 0 disables it and restores a uniform medium. Referenced to the camera rather than to an absolute world height because FNV has no single ground level -- every worldspace sits at its own Z.
Dither = true                       # Dither the ray march start offset to hide banding between steps.
DitherMotion = false                # Force the dither pattern to move every frame even with Temporal and TAA both off. Not needed otherwise: while Temporal or TAA is on the dither moves by itself (a golden-ratio step per frame) and the frames average into smooth shafts, which a fixed pattern cannot give because every frame repeats it. With both off nothing averages the frames, so this only swaps a still grain for shimmer; leave it off unless comparing.
Temporal = true                     # Average the light shafts over recent frames, reprojected for camera movement, at the march's half resolution before it is upsampled. The march's dither then moves every frame and the frames average into smooth shafts instead of fixed grain. Works with or without TAA (with both, the shafts are smoothed twice, which is fine). Turn off to see the raw single-frame march.
TemporalWeight = 0.9                # [0.5-0.97] How much of each frame is the history. 0.9 averages roughly the last ten frames: smoother the higher it goes, but shafts respond more slowly when the sun or a shadow moves.
TemporalClipGamma = 1.25            # [0.5-3.0] How far the history may stray from the current frame's neighbourhood before it is pulled back, in standard deviations. Higher keeps more history (smoother, more trailing when turning); lower rejects more (less trailing, more grain).

