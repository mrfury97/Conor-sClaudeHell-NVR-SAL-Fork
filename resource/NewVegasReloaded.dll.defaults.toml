[_Shaders.DitherBuster.Main]
Strength = 1.0                        # AA blend strength (0.0 = off, 1.0 = full).
MaskPower = 0.5                       # Edge detection sensitivity, as the exponent in pow(0.002, MaskPower). Because the base is below 1, RAISING this LOWERS the threshold and antialiases MORE edges - the opposite of what this line used to claim. 0.5 gives a threshold of 0.045, 1.0 gives 0.002.
DitherThreshold = 0.08                # [0.0-1.0, 0 disables] Catches isolated pixels that disagree with all four neighbours at once - alpha test dither, which the edge mask above is mathematically blind to because central differences cancel on a checkerboard. Those pixels get an isotropic average instead of the directional pass. Lower catches more dither; too low and it will start averaging fine texture detail and thin geometry like wires.
Radius = 1.0                          # [0.0-3.0] How far along the edge the directional samples reach, in texels. The samples were previously offset by the raw luma difference, which on an ordinary edge is a few hundredths of a texel - six samples of the same pixel, doing nothing. Normalising the direction and scaling it by this is what NFAA and BIAA do. 0 restores the old raw behaviour; above about 1.5 it starts to smear.

[_Shaders.DitherBuster.Status]
Enabled = true                        # Reduces dithering artifacts via luma-edge anti-aliasing.

[_Shaders.SMAA.Main]
EdgeDetection = 3                      # What counts as an edge. 0 luma, 1 colour, 2 depth, 3 luma and depth together. Luma and colour see shading and material edges; depth sees geometry and the alpha test edges they miss. 3 takes both and is the default - the gain over luma alone is small but real.
Threshold = 0.05                       # [0.005-0.5] Luma/colour contrast a pixel pair must differ by to count as an edge. Lower finds more edges and antialiases more of the image; too low starts smoothing texture detail.
DepthThreshold = 0.005                 # [0.0001-0.5] Depth edge sensitivity, as a fraction of the depth at that pixel rather than an absolute distance, so it behaves the same near and far. Affects EdgeDetection 2 and 3 only.
MaxSearchSteps = 32                    # [4-112] How far along an edge the search may travel looking for its end. Longer edges need more steps to be smoothed properly - shallow near horizontal ones most of all - and the cost is only paid where edges actually run that far.
SubpixelShift = 0.0                    # [-2.0-2.0] Shifts SMAA's sampling relative to the pixel it writes, in texels. **0.0 is the technically correct value**: the game's fullscreen quad already puts texture coordinates on texel centres, so sampling is exact and any offset moves it onto texel boundaries, where every fetch becomes a bilinear average of two pixels - a half pixel blur, which also lowers contrast enough that SMAA finds fewer edges. Compared side by side it is simply a blur: the apparent gain in edge smoothness and in DXVK grass dither is the softening, not antialiasing, so it ships at 0.0. Raise it only if you deliberately want that softness.
DepthOffset = 0.0                      # [-2.0-2.0] Shifts only the depth buffer lookups, in texels. **0.5 is the technically correct value**: the depth buffer is rendered separately from the colour buffer and the two sit half a texel apart, so at 0.0 depth found edges land slightly off from the colour edges being blended and look subtly distorted. It ships at 0.0 regardless, because that same misalignment suppresses DXVK's grass dithering far better than correct alignment does. Set 0.5 for cleaner, correctly placed depth edges and accept the dither returning. Affects EdgeDetection 2 and 3 only.
LocalContrast = 2.0                    # [1.0-20.0] How willing SMAA is to call something an edge when its neighbourhood is already busy. The stock 2.0 rejects edges in high contrast areas. Raising it does find more of them, but it will not clean up alpha test dither: SMAA blends by matching edges against a line pattern, and a dither is a checkerboard with no line to match, so the extra edges get near zero weight. Worth raising if finely detailed geometry is being skipped; too high and it starts working on texture noise.

[_Shaders.SMAA.Status]
Enabled = true						  # Apply SMAA.

[_Shaders.TAA.Main]
HistoryWeight = 0.9                    # [0.5-0.97] How much of each frame is last frame's result carried forward. 0.9 averages roughly the last ten frames. Higher is smoother and settles crawling edges more completely, but anything the reprojection gets wrong -- moving NPCs, since only camera motion is tracked -- lingers longer before it clears. Lower responds faster and stabilises less.
ClipGamma = 1.0                        # [0.5-2.5] How far last frame's colour may stray from what is around the pixel now before it is pulled back, in standard deviations of the 3x3 neighbourhood. This is the main defence against ghosting. Lower rejects stale history harder -- fewer trails behind moving things, but more of the flicker comes back; higher keeps more history -- steadier, but moving objects start leaving trails.
WeaponTAA = 1.0                        # [0.0-1.0] How much TAA applies to the first-person weapon and hands, as a scale on HistoryWeight for those pixels only. The weapon is not jittered, so TAA gives it no anti-aliasing -- only steadiness while it sways -- and because its own sway and bob are motion TAA cannot track, its texture can soften slightly as it moves. 1 treats it like the world, 0.5 halves the history for a steadier-but-sharper middle ground, 0 leaves the weapon exactly as rendered (MSAA and SMAA still apply).
Jitter = true                          # Shift the world render by a different fraction of a pixel each frame (an 8-frame Halton pattern), so TAA collects several sub-pixel samples of every pixel and anti-aliases a still image, not just edges in motion. Without it each frame samples identical pixel centres, and averaging identical frames changes nothing. Only the world scene is jittered: shadow maps, the first-person weapon and every NVR effect see the steady camera. Off gives stabilisation in motion only.
DebugView = 0                          # [0-5] Replaces the frame with a diagnostic view; the real TAA result keeps accumulating underneath, so switching back is seamless. 0 off. 1 motion: black = no movement, red/green = horizontal/vertical motion, full at 16 px per frame -- standing still must be all black, turning must give an even wash with the weapon staying black. 2 reprojection error: last frame vs this frame before any clipping -- THE test for trailing: turning past static scenery must stay mostly dark, lit only on edges and newly revealed areas; a doubled image lit everywhere means the reprojection is wrong. With Jitter on, edges flicker faintly here even standing still -- that is the jitter itself, and expected. 3 history use: grey = how much history is blended in (white full, black rejected), red = clipping fighting a ghost, expected on moving NPCs. 4 weapon mask: pixels treated as the first-person weapon in magenta -- must cover the weapon and hands exactly. 5 depth as TAA reads it, log scale, black near to white far.

[_Shaders.TAA.Status]
Enabled = false                        # Temporal anti-aliasing: blends each frame with the last, reprojected for camera motion. With Jitter on it anti-aliases still images as well as settling edges and fine detail that crawl as the view moves. The first-person weapon is reprojected with zero motion so it does not smear when turning.

[_Shaders.CinematicDOF.Main]
Mode = 1                               # [0-1] When the world blur is active. 0 always, 1 only in dialogue. Aiming does not switch it on. Weapon depth of field (WeaponDOF) has its own conditions and runs regardless of this.
FocalLength = 50.0                     # [10-300] Virtual lens focal length in mm, independent of the game's field of view. This is the main "how cinematic" control. FNV's 90 degree view is physically an 18mm lens, which barely blurs anything (under half a pixel of background blur focused at 14 m, at f/2.8) -- games deliberately use a longer virtual lens than their FOV implies, and so does this. 35-50 subtle, 85-135 strong portrait-style separation.
FStop = 2.0                            # [0.7-32] Aperture. Lower opens it up: a shallower focus zone and more blur everywhere else. Blur scales as 1/FStop, so f/1.4 is twice f/2.8.
AutoFocus = true                       # Focus on whatever is nearest under the crosshair (five world-depth taps around the screen centre), easing toward it like a real autofocus. Uses world depth only, so aiming down sights focuses on the target and never on your own weapon. Off uses FocusDistance.
FocusDistance = 1000.0                 # Focus distance in game units when AutoFocus is off. 70 units is about a metre.
FocusSpeed = 6.0                       # How fast autofocus settles on a new distance, per second. 6 reaches 95% in half a second; lower is a slower, more deliberate focus pull.
MinFocusDistance = 50.0                # Autofocus never focuses nearer than this, in game units, so brushing past a wall or foliage does not throw everything out of focus.
MaxBlur = 2.5                          # [0.1-6.0] Largest blur radius, as a percentage of screen height (2.5 is 27 px at 1080p). Caps the thin-lens blur and sets the bokeh kernel's reach. Very large values thin out the samples and look grainy.
HighlightBoost = 0.6                   # [0.0-0.95] Fakes HDR bokeh. This runs after tonemapping, so bright lights have no extra energy to swell into discs; boosting them through the blur and restoring them after makes highlights bloom into bokeh while leaving mid-tones alone. 0 is a plain blur.
WeaponBlur = 0.0                       # [0.0-1.0] How much the first-person weapon blurs by its own depth while the world blur is on (Mode). 0 keeps it sharp; 1 blurs it like any near object. For blur on the weapon alone, use WeaponDOF instead.
WeaponDOF = 0                          # [0-2] Weapon depth of field: blur on the first-person weapon only, growing toward your eye, so the receiver and the scope's eyepiece go soft while the muzzle and the world stay sharp. 0 off, 1 hip-fire only (switches off while aiming so the sights stay sharp), 2 always. Independent of Mode: the world is only blurred when Mode says so. Runs the whole effect while active, so it costs the same as the world depth of field.
WeaponFocusDistance = 40.0             # Game units from the eye beyond which the weapon stays sharp. Lower keeps more of the gun sharp; higher lets the blur reach further down the barrel. Use DebugView 1 (blue = weapon blur) to see where it starts.
WeaponBlurRange = 30.0                 # Game units over which the weapon's blur builds up, nearer than WeaponFocusDistance. Smaller is a quicker, harder falloff toward your eye; larger is a gentler one.
WeaponMaxBlur = 0.6                    # [0.05-3.0] Blur of the nearest parts of the weapon, as a percentage of screen height (0.6 is about 6 px at 1080p). Kept well below MaxBlur: a subtle softening reads as depth, a heavy one as a smeared gun.
NearFocusRange = 0.0                   # Game units in front of the focus point that stay sharp, extending the in-focus zone toward the camera (70 units is about a metre). Foreground blur starts past this distance and grows from zero there, so the edge of the zone is smooth. 0 is the pure lens: anything nearer than the focus point starts to blur at once. Raise it to keep nearby ground, cover or an NPC's shoulder sharp while still throwing the background out of focus.
NearBlurStrength = 1.0                 # [0.0-2.0] Scale on foreground blur only; background blur is untouched. 1 is the lens as calculated, 0 removes foreground blur entirely (background-only depth of field), above 1 exaggerates it. Still capped by MaxBlur.
TransitionTime = 0.25                  # Seconds to fade the effect in or out when it switches on or off -- entering or leaving dialogue, or weapon depth of field giving way when you raise the sights. 0 snaps.
BokehQuality = 1                       # [0-2] Samples per pixel in the bokeh blur: 0 = 48, 1 = 96, 2 = 160. A bright point's bokeh is drawn by exactly these samples, so at 48 with a large MaxBlur it breaks into separate dots and the shapes below barely show; 96 shows them, 160 fills them cleanly. Cost scales with the count, runs at half resolution and only while the effect is active. Lower MaxBlur also packs the samples closer together.
PostfilterRadius = 1.0                 # [0.0-2.0] Width of the smoothing pass run after the bokeh blur, in half-resolution pixels. 1 is the standard filter. 0 turns it off: crispest bokeh edges and shapes, but any grain or dots from the blur's sampling show. Up to 2 hides the dots of a low BokehQuality at the cost of rounding bokeh shapes and softening their edges. Raise BokehQuality first if the shapes matter.
BokehShape = 0                         # [0-4] Shape of the bokeh. 0 the lens aperture: round, or a polygon with ApertureBlades. 1 a star, with ApertureBlades points (5 if below 3). 2 a donut, the ring-shaped bokeh of mirror (catadioptric) lenses; its outside follows ApertureBlades. 3 a heart. 4 a cross. BladeRotation turns every shape, and BladeCurvature, CatsEye, Anamorphic and RingBrightness apply to all of them.
ShapeDetail = 0.5                      # [0.0-1.0] The shape's own control: how deep a star's points are cut (higher is spikier), how big a donut's hole is, or how thick a cross's arms are. Unused by the aperture and heart.
ApertureBlades = 0                     # [0-9] Number of aperture blades, which sets the shape of bokeh. 0 (or anything below 3) is a perfectly round aperture. 5 to 9 give the polygonal bokeh of real lenses stopped down: 6 is a common modern look, 5 and 7 read as older or cheaper glass.
BladeRotation = 0.0                    # [0-360] Rotation of the bokeh shape in degrees. Turns the polygon, star, cross and heart; a round aperture or donut is unaffected.
BladeCurvature = 0.0                   # [0.0-1.0] Rounds the polygon's sides back toward a circle, as the curved blades of modern lenses do. 0 is straight-sided, 1 is fully round again. Around 0.5 keeps a hint of the polygon.
Anamorphic = 1.0                       # [0.5-2.0] Stretches bokeh into an oval: height over width. 1 is round. Around 1.5 to 2.0 gives the tall oval bokeh of anamorphic cinema lenses; below 1 makes them wide instead. The disc's area is kept, so the overall amount of blur does not change.
CatsEye = 0.0                          # [0.0-1.0] Optical vignetting. Bokeh stay round in the middle of the frame and are clipped into lemon ("cat's eye") shapes toward the edges and corners, long side along the edge, as with fast real lenses wide open. 0 is off.
RingBrightness = 0.0                   # [-1.0-1.0] Where the light sits inside each bokeh disc. Above 0 brightens the rim for "soap bubble" bokeh, like older and mirror lenses; below 0 brightens the centre and fades the rim for smooth, creamy bokeh. The total light is unchanged. Most visible on bright points with HighlightBoost.
HighlightThreshold = 0.0               # [0.0-0.95] Brightness at which HighlightBoost starts. 0 boosts smoothly from black, lifting everything a little. Raise it (around 0.6 to 0.8) so only real highlights, such as lamps, sun glints and sky gaps, swell into discs while the rest of the blur stays even.
DebugView = 0                          # [0-3] Diagnostic views; each forces the effect on so it shows whatever Mode says. 1 blur map: red = background blur, blue = foreground blur, black = in focus, full brightness at MaxBlur. 2 weapon: the world in dim grey, the first-person weapon from green (sharp) to blue (WeaponMaxBlur) -- shows where weapon depth of field starts along the gun (needs WeaponDOF on). 3 focus: surfaces at the current focus distance in yellow and the five autofocus taps as red dots -- shows what autofocus has locked onto.

[_Shaders.CinematicDOF.Status]
Enabled = false                        # Camera-style depth of field: thin-lens blur from focal length and aperture, foreground blur that spreads past its outline, bokeh from highlights, and autofocus. Independent of the older DepthOfField effect -- turn that one off when using this, or the image is blurred twice.


