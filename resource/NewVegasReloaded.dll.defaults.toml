[_Shaders.Water.ComplexWater]
ScatterColorR = 0.015                # [0.0-2.0] The colour the water body glows with where the bed has faded out (linear; the default is a clear turquoise). Set all three to 0 to use each water's own colour from the game, which is much darker.
ScatterColorG = 0.15
ScatterColorB = 0.17
WaterColorBrightness = 1.0           # [0.1-5.0] Brightness of the water body's glow. Does not change the bed seen through shallow water.
AbsorptionColorR = 1.0               # [0.0-5.0] How fast the water absorbs each colour with depth: the colour absorbed fastest disappears first, so the bed seen through the water takes the others. Red high and green and blue low is the turquoise of clear water.
AbsorptionColorG = 0.22
AbsorptionColorB = 0.2
AbsorptionDepth = 1.2                # [0.1-5.0] How fast light is absorbed over the real depth of water the view passes through. At 1, 5 m of water still shows the bed clearly, 20 m barely. Higher is murkier, lower clearer.
WaveHeight = 12.0                    # [0-60] Typical height of the waves from trough to crest, in game units (about 70 to a metre). The waves are an animated patch of real wind-driven water (Textures\Water\NVR_WaterWaves.dds): sharp crests, broad troughs, each wave moving at the speed a real one of its length does. 0 leaves only the normal-map ripples.
WaveLength = 200.0                   # [50-5000] Typical length of the waves from crest to crest, in game units. Longer waves also pass more slowly, as real ones do.
WaveDirection = 45.0                 # [0-360] Direction the wind drives the waves toward, in degrees.
WaveSteepness = 0.5                  # [0.0-1.0] How steep the waves look: how strongly their slopes shade and glint. 0.5 is the waves as they are.
Whitecaps = 0.2                      # [0.0-1.0] Where the wave crests fold over, they break into foam. More takes less folding. 0 off.
WaveParallax = 1.0                   # [0.0-2.0] Waves stand up from the surface: seen at a low angle the crests hide the troughs behind them. 0 off.
RefractionBlur = 0.4                 # [0.0-3.0] The bed softens the more water it is seen through, as fine particles in real water blur what lies deep. 0 off.
RefractionDispersion = 0.1           # [0.0-1.0] Water bends red light a little less than blue: a faint colour split where the waves bend the view most. 0 off.
Caustics = 0.8                       # [0.0-3.0] Sunlight focused by the waves into bright rippling lines on the bed in shallow water. 0 off.
CausticsScale = 220.0                # [50-3000] Size of the caustic pattern on the bed, in game units (about 70 to a metre).
SunShadows = 1.0                     # [0.0-1.0] How much the sun shadow takes off the water where something shades it: the sun glint, the caustics, the glow through the waves and the sunlit water colour. The reflection stays. Needs ForwardShadows ([Shaders.ShadowsExteriors.Main]). 0 off.
SunGlitter = 1.5                     # [0.0-3.0] A broad sun path on the water full of sharp sparkles, as sunlit water seen toward the sun has. 0 is a single soft glint.
SpecularAA = 1.0                     # [0.0-1.0] Widens the sun and light glints where the waves are finer than a pixel, so distant water stops crawling. 0 is the sharp glint everywhere.
WaveScattering = 0.8                 # [0.0-3.0] Sunlight glowing through the tops and sides of the waves, in the water's colour, when looking toward a low sun. 0 off.
PointLights = 1.0                    # [0.0-3.0] Glints of lamps, campfires and other point lights on the water. 0 off.
ReflectionBlur = 0.4                 # [0.0-3.0] Blurs the reflection where the water is choppy; calm water stays mirror-sharp. 0 off.
ScreenSpaceReflections = 1.0          # [0.0-1.0] Reflections found in the scene on the screen, for what the game's reflection map leaves out or gets wrong: the pier and its posts, people, small objects, all at the angle the waves really reflect them. Where the screen holds nothing to reflect, the reflection map takes over. 0 off.
SkipReflectionPass = false            # Skips the game's reflection pass, which draws the world a second time, mirrored, on every frame with water in view -- a large CPU cost. Outdoor water then reflects the sky along the reflected ray, with ScreenSpaceReflections for everything on the screen; distant hills and anything off the screen no longer reflect. Only while Complex Water is on.
Foam = 0.8                           # [0.0-1.0] Foam where the water meets the shore and around anything standing in it (Textures\Water\NVR_Foam.dds): solid at the edge, breaking into cells and then streaks further out, drifting. 0 off.
FoamWidth = 20.0                     # [2-400] How far out from the edge the dense foam reaches -- the distance the view passes through the water there (game units, about 70 to a metre); its streaks reach twice as far.
FoamScale = 250.0                    # [20-5000] Size of the foam pattern: game units the foam texture spans. Smaller gives finer bubbles.
ShoreFadeWidth = 25.0                # [0-300] The water fades out softly over this much depth at the shoreline, lapping gently in and out (shoreMovement sets the speed). 0: no fade.
DebugView = 0                        # [0-16] Shows one term on its own, in place of the water. Restart the game to change it (it is compiled into the water shaders, so it costs nothing when off). 1 sun shadow on the surface (black in shadow). 2 what still shows through the water, per colour. 3 reflection amount (black none, white full). 4 wave scattering. 5 glint roughness (black calm, white widened). 6 point-light glints. 7 the path the view takes through the water (black 0, white 20 m). 8 the depth below the surface (black 0, white 20 m). 9 foam. 10 shoreline fade (black see-through, white solid). 11 caustics. 12 wave height (black trough, white crest). 13 depth calibration (mid-grey: the near plane matches). 14 depth below the surface over 0-100 m, red where the depth buffer holds nothing behind the water. 15 the two depth copies: red the depth taken as the water is drawn, green the depth taken before any water, blue where the first shows the water itself. 16 screen-space reflections: what they found, where they are used (black: the reflection map is used). 0 off.

