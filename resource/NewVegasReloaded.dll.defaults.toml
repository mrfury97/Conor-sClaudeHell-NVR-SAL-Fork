[_Shaders.Grass.Main]
ScaleX = 1.0
ScaleY = 1.0
ScaleZ = 1.0
ColorVariation = 0.5                  # [0.0-1.0] Patches of drier, straw-tinted grass and lusher, greener grass across fields instead of one uniform tint, fixed to the ground so they stay put as you move. 0 off; 1 strongest.
ColorVariationScale = 1500.0          # [100-20000] Size of those patches in game units (70 units is about a metre). Larger gives broad sweeps across a field; smaller, a patchwork.
DryTips = 0.4                         # [0.0-1.0] Shifts each blade toward the dry colour over its upper part, like sun-bleached grass: tall clumps dry out over their top, short tufts barely change. 0 off.
DryTipsHeight = 25.0                  # [0-300] Game units above the base of a clump where the drying starts (70 units is about a metre).
DryTipsFade = 30.0                    # [1-300] Game units above DryTipsHeight over which it reaches full strength.
DryTipsColorR = 1.2                   # [0.0-2.0] Red of the dry tip colour, a multiplier on the grass texture. The default 1.2, 1.05, 0.6 is straw.
DryTipsColorG = 1.05                  # [0.0-2.0] Green of the dry tip colour.
DryTipsColorB = 0.6                   # [0.0-2.0] Blue of the dry tip colour.
GrazingBrightening = 0.3              # [0.0-1.0] Looking across a field at a low angle you mostly see the lighter blade tips, not the dark roots and ground between clumps: grass seen near edge-on is lifted by up to this much and its RootDarkening eased. Looking down on grass, no change. 0 off.
ColorVariationBrightness = 0.3        # [0.0-1.0] How much the patches also vary in brightness, as a share of ColorVariation. 0 colour only.
Brightness = 1.0                      # [0.1-2.0] Scales the grass texture's colour. Below 1 darkens grass that reads too bright or washed out under the added grass lighting; above 1 brightens it. 1 unchanged.
Translucency = 0.6                    # [0.0-3.0] Sunlight through the blades when the sun is behind them: the glow of a backlit field, tinted by the grass colour and cut by shadows. Point lights (campfires, lamps) behind grass make it glow the same way. 0 off.
TranslucencyColorR = 1.0              # [0.0-2.0] Red of the translucency colour: tints the light glowing through backlit blades (sun and point lights) on top of the grass texture's colour. 1, 1, 1 leaves it as the texture tints it; warmer values (e.g. 1.1, 1.0, 0.6) give a golden backlit glow.
TranslucencyColorG = 1.0              # [0.0-2.0] Green of the translucency colour.
TranslucencyColorB = 1.0              # [0.0-2.0] Blue of the translucency colour.
TranslucencyFocus = 4.0               # [1-32] How tightly the glow gathers around the sun's direction. Higher is a narrower, more concentrated rim around the sun; lower spreads it across more of the view.
Roundness = 0.6                       # [0.0-3.0] Bends each blade's lighting outward from the clump's centre, so the side of a clump facing away from the sun falls into shade instead of a whole field being one flat tone. 0 is vanilla flat cards.
DiffuseWrap = 0.5                     # [0.0-1.0] How far sunlight wraps around the rounded blades. Thin blades pass and scatter light, so the side of a clump facing away from the sun should dim gradually, not go black. 0 is plain N.L (the far side black wherever the sun is behind it); 0.5 dims it smoothly; 1 lights all but the exact back. Only matters with Roundness above 0 or a normal map.
AmbientNormal = 1.0                   # [0.0-1.0] Takes the sky light from the lit blade normal (Roundness and normal maps) instead of the flat card, so the side of a clump facing away from the sky also gets less sky light and normal-map detail shows in shade. 0 is the flat card, as before; 1 fully the lit normal. Applies within DetailDistance.
RootDarkening = 0.35                  # [0.0-1.0] Shades blades toward the ground, like the clump shadowing its own base. 0 off.
RootDarkeningHeight = 20.0            # [1-200] Game units up from the base of each clump over which RootDarkening fades out (70 units is about a metre). Lower keeps the shade tight to the ground; higher darkens more of the blade. DebugView 6 shows it: black at the base to white at this height.
Specular = 0.15                       # [0.0-2.0] Soft sheen on blades facing between you and the sun, and on blades near point lights (campfires, lamps) the same way. Needs Roundness above 0 or a normal map to vary across a clump; a normal map's alpha masks it per pixel. 0 off.
SpecularGlossiness = 16.0             # [1-128] Size of the sheen: higher is a smaller, sharper highlight; lower a broad, soft one.
PointLights = 1.0                     # [0.0-3.0] Strength of point lights (campfires, lamps, torches) on grass. Vanilla grass ignores them completely; this uses NVR's nearby-light list, the same one the water uses, with the object shaders' attenuation and the same DiffuseWrap as the sun; with Specular above 0 they also put a sheen on nearby blades. No point-light shadows on grass. 0 off.
DetailDistance = 2500.0               # [0-20000] Game units from the camera at which the costly grass lighting (Roundness, DiffuseWrap, Translucency, Specular, PointLights, normal maps) starts fading out; past it grass keeps the plain sun, shadows, sky light and root darkening. The biggest performance lever for grass. 0 = no limit.
DetailFade = 1000.0                   # [1-10000] Game units over which that fade happens, so there is no visible line.
ShadowDistance = 0.0                  # [0-20000] Game units from the camera past which grass stops taking forward sun shadows (Forward shadows mode only). Shadows are the next most costly part. 0 = no limit.
ShadowFade = 1000.0                   # [1-10000] Game units over which grass shadows fade out.
NormalMaps = 1.0                      # [0.0-2.0] Strength of per-texture grass normal maps: for each grass texture, a <name>_n.dds beside it as a loose file under Data\Textures (not inside a BSA). Grass without one is unchanged. Tilts the normal that the sun, DiffuseWrap, PointLights and Specular light; its alpha masks Specular. Applies within DetailDistance. DebugView 10 shows which grass has one. 0 off.
NormalMapFlipGreen = false            # Flip the normal maps' green channel, for maps authored the other way up (lighting looks inverted top to bottom).
DebugView = 0                         # [0-13] Shows one term of the grass lighting on its own. 1 rounded (and normal-mapped) normals as colour (a clump should shade from one colour to another across it; one flat colour means Roundness is 0 or the data is missing). 2 sun diffuse, N.L times shadow. 3 sun shadow alone (black in shadow) -- shadows falling on grass should appear here. 4 translucency glow, from the sun and point lights: brightest looking toward the sun. 5 sheen, from the sun and point lights. 6 root (black) to tip (white) over RootDarkeningHeight: each clump should run black at the ground to white higher up. 7 which grass vertex shader drew the pixel: red 000, green 001, blue 002, yellow 003. 8 point lights alone, in their own colour. 9 distance falloffs: yellow full lighting, green shadows only (past DetailDistance), black neither. 10 normal maps: the normal-mapped normal as colour where grass has a map, dark grey where it has none. 11 colour variation: the tint applied, at half brightness (mid grey is unchanged). 12 grazing-angle brightening: black none to white full. 13 dry tips: black none to white fully dry.

